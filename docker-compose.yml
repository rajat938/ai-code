services:
  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: Admin@123
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ollama-mern-network

  # Ollama is NOT run in Docker any more.
  # It runs directly on Windows (install from https://ollama.com/download) for full CPU speed.
  # Download the models once in PowerShell:
  #   ollama pull qwen2.5:1.5b
  #   ollama pull llama3.2:3b
  #   ollama pull all-minilm

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: server
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    # Inside Docker, services reach each other by service name, NOT localhost.
    # host.docker.internal = the Windows PC itself, where Ollama runs.
    environment:
      MONGO_URI: mongodb://root:Admin%40123@mongodb:27017/ollama_mern?authSource=admin
      OLLAMA_URL: http://host.docker.internal:11434
      CLIENT_ORIGIN: http://localhost:3011
      DEFAULT_MODEL: llama3.2:3b
      EMBED_MODEL: all-minilm
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ollama-mern-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: client
    restart: unless-stopped
    ports:
      - "3011:80"
    depends_on:
      - server
    networks:
      - ollama-mern-network

networks:
  ollama-mern-network:
    driver: bridge

volumes:
  mongodb_data:
