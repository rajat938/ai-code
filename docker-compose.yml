services:
  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: Admin@123
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ollama-mern-network

  ollama:
    build:
      context: ./ollama
      dockerfile: Dockerfile
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      # Small model = much faster on CPU. Change to llama3.2 (3B) if you have 8 GB+ RAM.
      MODEL: qwen2.5:1.5b
      OLLAMA_KEEP_ALIVE: 24h        # keep the model in RAM (no reload delay between prompts)
      OLLAMA_NUM_PARALLEL: 1        # one answer at a time = less RAM, faster on CPU
      OLLAMA_NO_CLOUD: "1"          # local only: no Ollama cloud models / online lookups
      OLLAMA_MAX_LOADED_MODELS: 2   # chat model + the tiny (~45 MB) policy-search model
      EMBED_MODEL: all-minilm       # used to search company policy documents by meaning
    volumes:
      - ollama_data:/root/.ollama
    # Healthy only after the model has finished downloading
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ollama-ready"]
      interval: 10s
      timeout: 5s
      retries: 360
      start_period: 30s
    # Uncomment to use an NVIDIA GPU (needs nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    networks:
      - ollama-mern-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: server
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    # Inside Docker, services reach each other by service name, NOT localhost
    environment:
      MONGO_URI: mongodb://root:Admin%40123@mongodb:27017/ollama_mern?authSource=admin
      OLLAMA_URL: http://ollama:11434
      CLIENT_ORIGIN: http://localhost:3000
      DEFAULT_MODEL: qwen2.5:1.5b
      EMBED_MODEL: all-minilm
    depends_on:
      mongodb:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - ollama-mern-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - ollama-mern-network

networks:
  ollama-mern-network:
    driver: bridge

volumes:
  mongodb_data:
  ollama_data:
